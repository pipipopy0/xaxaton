services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${database:-calendator}
      POSTGRES_USER: ${user:-calendator}
      POSTGRES_PASSWORD: ${password:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  duckling:
    image: rasa/duckling:latest
    restart: unless-stopped

  bot:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      host: postgres
      port: 5432
      DUCKLING_URL: http://duckling:8000
    depends_on:
      postgres:
        condition: service_healthy
      duckling:
        condition: service_started
    volumes:
      - logs:/root/Calendator/logs
      - ./media:/root/Calendator/media:ro
    command: ["python", "main.py"]

  webhook:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      host: postgres
      port: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - logs:/root/Calendator/logs
      - ./media:/root/Calendator/media:ro
    command: ["python", "services/flask_service.py"]
    expose:
      - "8005"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - webhook
    volumes:
      - ./SITE:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  logs:
